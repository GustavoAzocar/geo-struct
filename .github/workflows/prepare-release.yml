name: Prepare immutable source tag
on:
  push:
    branches: [master]
    paths: [.github/release-request.json]
permissions:
  contents: write
jobs:
  tag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Validate and create immutable tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/prepare-release.mjs
