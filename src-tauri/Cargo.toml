[package]
name = "geostruct"
version = "0.1.0"
description = "Modelagem geotécnica 2D para taludes e contenções"
authors = ["Ricardo Corsini"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "geostruct_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
